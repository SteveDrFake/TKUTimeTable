<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">
<title>淡江課表</title>
</head>
<body>
<header class="topbar">
  <div>
    <div class="title">淡江課表</div>
    <div id="subtitle" class="subtitle">尚未登入</div>
  </div>
  <div class="top-actions">
    <button id="syncBtn" class="btn primary">同步</button>
    <button id="settingsBtn" class="btn">設定</button>
  </div>
</header>

<main class="page">
  <section class="account">
    <div>
      <div id="studentName" class="student-name">尚未登入</div>
      <div id="studentId" class="student-id">請先登入淡江帳號</div>
    </div>
    <span id="onlineState" class="pill">離線可用</span>
  </section>

  <section class="weekbar">
    <button id="prevWeek" class="round">‹</button>
    <button id="todayBtn" class="weekbtn"><strong>本週</strong><span id="weekText">—</span></button>
    <button id="nextWeek" class="round">›</button>
  </section>

  <section class="table-wrap">
    <div id="grid" class="grid"></div>
  </section>

  <section id="message" class="message hidden"></section>
</main>

<div id="overlay" class="overlay hidden">
  <div id="settingsPanel" class="panel hidden">
    <div class="panel-head">
      <div><strong>設定</strong><small>帳號、同步與顯示</small></div>
      <button class="close" data-close>×</button>
    </div>
    <div class="panel-body">

      <h3>淡江帳號</h3>
      <div class="box">
        <div><span>姓名</span><b id="setName">尚未取得</b></div>
        <div><span>學號</span><b id="setId">尚未取得</b></div>
        <div><span>登入狀態</span><b id="setAuth">未登入</b></div>
      </div>
      <button id="loginBtn" class="wide primary">🔐 淡江登入</button>
      <button id="sync2Btn" class="wide">↻ 同步課表</button>
      <button id="directApiBtn" class="wide">🧪 直接測試淡江 /api/stu/course</button>
      <button id="clearAuthBtn" class="wide danger-soft">清除本機登入狀態</button>

      <h3>課表顯示</h3>
      <div id="daySettings" class="toggle-grid"></div>
      <div id="periodSettings" class="toggle-grid"></div>
      <label class="switch"><span>顯示座號</span><input id="showSeat" type="checkbox"></label>

      <h3>本機資料</h3>
      <button id="demoBtn" class="wide">載入範例課表</button>
      <button id="clearBtn" class="wide">清除課表</button>
      <button id="exportBtn" class="wide">匯出 JSON</button>
      <label class="wide file">匯入 JSON<input id="importBtn" type="file" accept="application/json,.json"></label>
      <button id="wipeBtn" class="wide danger">清除全部本機資料</button>

      <h3>後端 API</h3>
      <label class="field"><span>Backend URL（可留空）</span><input id="backendUrl"></label>
      <button id="saveBackendBtn" class="wide">儲存 Backend URL</button>
      <div class="hint">
        預設會使用與本 GitHub Pages 不同來源的後端。後端負責處理 TKU 登入與 iLife API，前端不直接呼叫 ilifeapi。
      </div>
    </div>
  </div>

  <div id="coursePanel" class="panel hidden">
    <div class="panel-head">
      <div><strong id="courseTitle">課程</strong><small id="courseSub"></small></div>
      <button class="close" data-close>×</button>
    </div>
    <div class="panel-body">
      <label class="field"><span>自訂課名</span><input id="customName" placeholder="留空使用學校名稱"></label>
      <div id="courseInfo" class="info-grid"></div>
      <h3>上課時間</h3><div id="timeList"></div>
      <label class="field"><span>課程說明</span><textarea id="desc" rows="4" readonly></textarea></label>
      <label class="field"><span>我的備註</span><textarea id="note" rows="4"></textarea></label>
      <h3>我的記事</h3>
      <button id="addJournal" class="wide">＋新增記事</button>
      <div id="journalList"></div>
      <button id="saveCourse" class="wide primary">儲存</button>
    </div>
  </div>
</div>

<script src="./app.js"></script>
</body>
</html>
